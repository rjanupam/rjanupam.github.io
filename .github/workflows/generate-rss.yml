name: Generate RSS Feed

on:
  push:
    branches:
      - master
    paths:
      - "posts/**"
      - "js/build.js"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run RSS generator
        run: node js/build.js

      - name: Commit and push RSS feed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/rss_feed.xml posts/articles/
          git commit -m "chore: update RSS feed" || echo "No changes to commit"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/rjanupam/rjanupam.github.io.git
        env:
          GIT_AUTH_TOKEN: ${{ secrets.GH_PAT }}
