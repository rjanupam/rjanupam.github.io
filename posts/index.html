<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpg" href="../images/profile_pic.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>anupam's posts</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="RSS Feed"
      href="feed.xml"
    />
  </head>
  <body class="space-mono-regular">
    <div class="screen">
      <div class="name space-mono-bold">anupam</div>
      <hr />
      <a href="../index.html">home</a>
      <hr />
      <div class="post-list">
        <ul id="post-list"></ul>
        <div id="loading">loading posts...</div>
        <div id="error" style="display: none; color: #ff5555">
          failed to load posts. check console.
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetch("posts.json")
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
          })
          .then((posts) => {
            document.getElementById("loading").style.display = "none";
            const list = document.getElementById("post-list");

            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            posts.forEach((post) => {
              const item = document.createElement("li");
              const postDate = new Date(post.date).toLocaleDateString("en-CA", {
                year: "numeric",
                month: "short",
                day: "numeric",
              });

              item.innerHTML = `
                <span class="post-date">${postDate}</span> ~
                <a href="viewer.html?post=${encodeURIComponent(post.file)}" class="post-link">
                  ${post.title}
                </a>
              `;
              list.appendChild(item);
            });
          })
          .catch((error) => {
            console.error("Error loading posts:", error);
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";
          });
      });
    </script>

    <script src="../js/script.js"></script>
  </body>
</html>
