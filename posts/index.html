<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpg" href="../static/images/profile_pic.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>anupam's posts</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Anupam's RSS Feed"
      href="rss_feed.xml"
    />
  </head>
  <body>
    <div class="screen">
      <header>
        <div class="name">anupam</div>
        <nav>
          <a href="/">home</a>
          <a href="/posts">posts</a>
          <a href="/projects">projects</a>
          <a href="rss_feed.xml" class="rss-link">
            <svg
              fill="currentColor"
              width="1em"
              height="1em"
              viewBox="0 0 1920 1920"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M53.333 628.96c682.454 0 1237.76 555.2 1237.76 1237.76v53.333H882.24v-53.333c0-457.067-371.84-828.907-828.907-828.907H0V628.96Zm0-628.96C1082.56 0 1920 837.44 1920 1866.667V1920h-408.853v-53.333c0-803.84-653.974-1457.814-1457.814-1457.814H0V0ZM267.19 1386.667c146.774 0 266.134 119.36 266.134 266.133 0 146.773-119.36 266.24-266.134 266.24S.95 1799.573.95 1652.8c0-146.773 119.467-266.133 266.24-266.133Z"
                fill-rule="evenodd"
              />
            </svg>
            RSS
          </a>
        </nav>
      </header>
      <hr />
      <main class="post-list">
        <ul id="post-list"></ul>
        <div id="loading">loading posts...</div>
        <div id="error" style="display: none; color: #ff5555">
          failed to load posts. check console.
        </div>
      </main>
      <footer>
        <p>&copy; 2025 rjanupam.me</p>
      </footer>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetch("posts.json") // Still fetches posts.json for the list
          .then((res) => {
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            return res.json();
          })
          .then((posts) => {
            document.getElementById("loading").style.display = "none";
            const list = document.getElementById("post-list");

            posts.sort((a, b) => new Date(b.date) - new Date(a.date));

            posts.forEach((post) => {
              const item = document.createElement("li");
              const postDate = new Date(post.date).toLocaleDateString("en-CA", {
                year: "numeric",
                month: "short",
                day: "numeric",
              });

              item.innerHTML = `
                <span class="post-date">${postDate}</span> ~
                <a href="articles/${post.file}.html" class="post-link">
                  ${post.title}
                </a>
              `;
              list.appendChild(item);
            });
          })
          .catch((error) => {
            console.error("Error loading posts:", error);
            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "block";
          });
      });
    </script>
    <div id="lain-takeover" class="lain-takeover" style="display: none">
      <div class="lain-text"></div>
      <div id="lain-images" class="lain-images"></div>
      <button id="lain-dismiss" class="lain-dismiss">✖</button>
    </div>
    <audio id="lain-audio" loop src="/static/audio/lain-takeover.mp3"></audio>
    <script src="../js/script.js"></script>
  </body>
</html>
