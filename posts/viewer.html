<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpg" href="../static/images/profile_pic.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <title>anupam's post</title>
    <link rel="stylesheet" href="../static/style.css" />
    <link
      rel="stylesheet"
      id="hljs-theme-light"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css"
      media="not all"
      disabled
    />
    <link
      rel="stylesheet"
      id="hljs-theme-dark"
      href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
      media="not all"
      disabled
    />
  </head>
  <body>
    <div class="screen">
      <header>
        <div class="name">anupam</div>
        <nav class="nav-bar">
          <a href="/posts">back to posts</a>
          <div
            id="view-counter-container"
            class="view-counter"
            style="display: none"
          >
            <span class="view-icon">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
            <span class="view-count">0</span>
            <span class="view-label">views</span>
          </div>
        </nav>
      </header>
      <hr />
      <main id="post-content"></main>
      <footer>
        <p>&copy; 2025 rjanupam.me</p>
      </footer>
    </div>

    <script src="../js/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const mdFile = urlParams.get("post");

        if (mdFile) {
          fetch(`markdown/${mdFile}.md`)
            .then((res) => {
              if (!res.ok) {
                throw new Error(`error fetching: ${res.status}`);
              }
              return res.text();
            })
            .then((markdown) => {
              const html = markdownRender(markdown);
              const postContentElement =
                document.getElementById("post-content");
              postContentElement.innerHTML = html;

              // load highlight.js
              if (typeof hljs !== "undefined") {
                postContentElement
                  .querySelectorAll("pre code")
                  .forEach((block) => {
                    hljs.highlightElement(block);
                  });
                const currentSiteTheme =
                  document.documentElement.getAttribute("data-theme") ||
                  "light";
                updateHljsTheme(currentSiteTheme);
              } else {
                console.warn(
                  "highlight.js not loaded, code blocks will not be highlighted.",
                );
              }
            })
            .catch((error) => {
              console.error("error loading post: ", error);
              document.getElementById("post-content").innerHTML =
                "<p>something went wrong</p>";
            });
        } else {
          document.getElementById("post-content").innerHTML =
            "<p>No post specified. Please select a post from the <a href='index.html'>posts page</a></p>";
        }
      });
    </script>
    <div id="lain-takeover" class="lain-takeover" style="display: none">
      <div class="lain-text"></div>
      <div id="lain-images" class="lain-images"></div>
      <button id="lain-dismiss" class="lain-dismiss">✖</button>
    </div>
    <audio id="lain-audio" loop src="static/audio/lain-takeover.mp3"></audio>
    <script src="../js/script.js"></script>
    <script src="../js/views-count.js"></script>
  </body>
</html>
